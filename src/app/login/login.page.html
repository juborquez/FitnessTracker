<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        ← Atrás
      </ion-button>
    </ion-buttons>
    <ion-title>Login</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goHome()">
        🏠 Home
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="login-container">
    <ion-card>
      <ion-card-content>
        <h2>Iniciar Sesión</h2>
        <p>Accede a tu rutina de ejercicios</p>
        
        <ion-item>
          <ion-label position="stacked">Usuario</ion-label>
          <ion-input 
            [(ngModel)]="username" 
            placeholder="Ingresa tu usuario"
            type="text">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Contraseña</ion-label>
          <ion-input 
            [(ngModel)]="password" 
            placeholder="Ingresa tu contraseña"
            type="password">
          </ion-input>
        </ion-item>

        <ion-button 
          expand="block" 
          (click)="login()" 
          style="margin-top: 20px;">
          Iniciar Sesión
        </ion-button>

        <div class="auth-links" style="text-align: center; margin-top: 15px;">
          <ion-button 
            fill="clear" 
            size="small"
            (click)="goToResetPassword()">
            ¿Olvidaste tu contraseña?
          </ion-button>
        </div>

        <div class="demo-info" style="text-align: center; margin-top: 10px;">
          <ion-button 
            fill="clear" 
            size="small"
            (click)="showValidUsers()">
            Ver usuarios de prueba
          </ion-button>
        </div>
        
        <div class="navigation-buttons">
          <ion-button 
            fill="outline" 
            (click)="goBack()" 
            style="margin-top: 10px; margin-right: 5px;">
            ← Atrás
          </ion-button>
          <ion-button 
            fill="outline" 
            (click)="goHome()" 
            style="margin-top: 10px; margin-left: 5px;">
            🏠 Home
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-toast
    [isOpen]="isToastOpen"
    [message]="toastMessage"
    [duration]="3000"
    [color]="toastColor"
    (didDismiss)="setToastOpen(false)">
  </ion-toast>
</ion-content>
