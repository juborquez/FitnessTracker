<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Restablecer Contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ion-padding">
    <ion-card *ngIf="!isEmailSent">
      <ion-card-content>
        <ion-item>
          <ion-label position="floating">Email</ion-label>
          <ion-input type="email" [(ngModel)]="email"></ion-input>
        </ion-item>
        
        <div class="ion-margin-top">
          <ion-button expand="block" (click)="resetPassword()">
            Enviar enlace de restablecimiento
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>

    <ion-card *ngIf="isEmailSent">
      <ion-card-content>
        <h2>¡Email enviado!</h2>
        <p>Se ha enviado un enlace de restablecimiento a tu correo electrónico.</p>
        <div class="ion-margin-top">
          <ion-button expand="block" (click)="goBack()">
            Volver al inicio de sesión
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-toast
    [isOpen]="isToastOpen"
    [message]="toastMessage"
    [color]="toastColor"
    duration="3000"
  ></ion-toast>
</ion-content>
