<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        ← Atrás
      </ion-button>
    </ion-buttons>
    <ion-title>Login</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goHome()">
        🏠 Home
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="login-container">
    <ion-card>
      <ion-card-content>
        <h2>Iniciar Sesión</h2>
        <p>Accede a tu rutina de ejercicios</p>
        
        <ion-item>
          <ion-label position="stacked">Email</ion-label>
          <ion-input 
            [(ngModel)]="email" 
            placeholder="Ingresa tu email"
            type="email">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Contraseña</ion-label>
          <ion-input 
            [(ngModel)]="password" 
            placeholder="Ingresa tu contraseña"
            type="password">
          </ion-input>
        </ion-item>

        <div class="ion-padding">
          <ion-button expand="block" (click)="login()" [disabled]="isRegistering">
            Iniciar Sesión
          </ion-button>

          <ion-button expand="block" (click)="register()" fill="outline" [disabled]="isRegistering">
            Registrarse
          </ion-button>

          <div *ngIf="isRegistering" class="ion-text-center ion-padding-top">
            <ion-spinner></ion-spinner>
            <p>Registrando usuario...</p>
          </div>

          <div class="auth-links ion-text-center ion-padding-top">
            <ion-button 
              fill="clear" 
              size="small"
              (click)="goToResetPassword()">
              ¿Olvidaste tu contraseña?
            </ion-button>
          </div>

          <div class="demo-info ion-text-center ion-padding-top">
            <ion-button 
              fill="clear" 
              size="small"
              (click)="showValidUsers()">
              Ver usuarios de prueba
            </ion-button>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-toast
    [isOpen]="isToastOpen"
    [message]="toastMessage"
    [duration]="3000"
    [color]="toastColor"
    (didDismiss)="setToastOpen(false)">
  </ion-toast>
</ion-content>
